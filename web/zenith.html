<div id="toast" style="display:none;position:fixed;bottom:112px;left:50%;transform:translateX(-50%);z-index:2000;background:var(--panel);border:1px solid var(--acc);color:var(--tx);border-radius:10px;padding:8px 18px;font-size:12px;box-shadow:var(--shadow);animation:zfade .2s ease;white-space:nowrap;pointer-events:none"></div>
<script>
"use strict";
/* ================= CONFIG (real device) ================= */
/* Broker/topics/keys come from an untracked config.js when present (copy
   config.example.js). Keys are NEVER shipped in this file: enter them in the
   key vault (🗝) — they live only in this tab's memory and are wiped on close. */
const CFG = window.ZENITH_CONFIG || {};
const BROKER = CFG.broker || "wss://broker.example.com:8884/mqtt";
const DEVICES = (CFG.devices || [
  {id:"trk01",name:"Vehicle 1",topic:"yourprefix/trk01/pos",cmd:"yourprefix/trk01/cmd"}
]).map(d=>({keyHex:"",...d}));
const OFFLINE_MS=60000;

/* ================= STATE ================= */
const S={theme:'dark',lang:'tr',layer:'default',selId:DEVICES[0].id,focusId:null,mode:'live',scrub:1,playing:false,speed:2,
  follow:false,layersOpen:false,paletteOpen:false,consoleOpen:false,consoleTab:'usb',vaultOpen:false,vaultPick:null,keyMode:'session',
  keyErr:false,settingsOpen:false,search:'',unit:'km',interval:5,notifMove:true,notifOff:false,mobile:false,rangeKey:'1sa',
  logs:[{c:'var(--tx3)',t:'— ZENITH konsol hazir —'}],cmdIn:'',keyIn:'',mqtt:'off'};

const fleet=DEVICES.map(d=>({id:d.id,name:d.name,online:false,warn:false,mov:false,cur:null,track:[],stops:[],lastRaw:null}));
const DEV=id=>DEVICES.find(d=>d.id===id);
const V=id=>fleet.find(v=>v.id===id);
const KEYS={};                         // deviceId -> CryptoKey (in-memory only)
let map,client,mk={},trail,acc,ghost,stopMks=[],tileL,dragging=false;

/* ================= i18n ================= */
function dict(){const tr=S.lang==='tr';return tr?
{veh:'araç',online:'çevrimiçi',moving:'hareket',warn:'uyarı',search:'ara / komut…  ⌘K',palTitle:'Komutlar',live:'CANLI',hist:'GEÇMİŞ',backLive:'canlıya dön',follow:'takip',fit:'sığdır',addDev:'Cihaz Ekle',focusMode:'ODAK',exitFocus:'odaktan çık',focusBtn:'Odak',console:'Konsol',share:'paylaş',acc:'Hassasiyet',sats:'Uydu',alt:'İrtifa',heading:'Yön',pos:'Konum',updated:'güncelleme',stops:'Duraklar',stopsL:'durak',kmToday:'km',drive:'sürüş',avgSpd:'ort km/s',park:'PARK',moveTxt:'HAREKET',offline:'ÇEVRİMDIŞI',warnS:'ZAYIF SİNYAL',futureBatt:'batarya · kontak — ileride',settings:'Ayarlar',vault:'Anahtar Kasası',theme:'Tema',dark:'Koyu',light:'Açık',langL:'Dil / Language',defLayer:'Varsayılan katman',unit:'Birim',repInt:'Raporlama aralığı',notifMove:'Bildirim: hareket başladı',notifOff:'Bildirim: çevrimdışı kaldı',lyDefault:'Varsayılan',lySat:'Uydu',lyTerrain:'Arazi',connected:'bağlı',clear:'Temizle',send:'Gönder',freeCmd:'AT+…  (↵ gönderir)',enterKey:'anahtar gir',unlocked:'kilidi açık',keyFor:'AES-256 anahtarı (64 hex)',keyIn:'0f3a…  64 hex',unlock:'Kilidi aç',session:'oturumluk',manual:'elle gir',keyErrTxt:'Geçersiz anahtar — 64 hex olmalı',vaultNote:'Anahtarlar yalnız bu sekmenin belleğinde tutulur; sayfa kapanınca silinir. Hiçbir anahtar düz metin gösterilmez/kaydedilmez.',gap:'veri yok (kapsama boşluğu)',qual1:'çok iyi',qual2:'iyi',qual3:'zayıf'}:
{veh:'vehicles',online:'online',moving:'moving',warn:'alerts',search:'search / command…  ⌘K',palTitle:'Commands',live:'LIVE',hist:'HISTORY',backLive:'back to live',follow:'follow',fit:'fit all',addDev:'Add Device',focusMode:'FOCUS',exitFocus:'exit focus',focusBtn:'Focus',console:'Console',share:'share',acc:'Accuracy',sats:'Satellites',alt:'Altitude',heading:'Heading',pos:'Position',updated:'updated',stops:'Stops',stopsL:'stops',kmToday:'km',drive:'driving',avgSpd:'avg km/h',park:'PARKED',moveTxt:'MOVING',offline:'OFFLINE',warnS:'WEAK SIGNAL',futureBatt:'battery · ignition — coming soon',settings:'Settings',vault:'Key Vault',theme:'Theme',dark:'Dark',light:'Light',langL:'Language',defLayer:'Default layer',unit:'Units',repInt:'Report interval',notifMove:'Notify: started moving',notifOff:'Notify: went offline',lyDefault:'Default',lySat:'Satellite',lyTerrain:'Terrain',connected:'connected',clear:'Clear',send:'Send',freeCmd:'AT+…  (↵ to send)',enterKey:'enter key',unlocked:'unlocked',keyFor:'AES-256 key (64 hex)',keyIn:'0f3a…  64 hex',unlock:'Unlock',session:'session',manual:'manual',keyErrTxt:'Invalid key — must be 64 hex',vaultNote:'Keys live only in this tab memory and are wiped on close. No key is displayed or stored in plaintext.',gap:'no data (coverage gap)',qual1:'excellent',qual2:'good',qual3:'poor'};}

/* ================= helpers ================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hexBytes=h=>{h=h.trim();const a=new Uint8Array(h.length/2);for(let i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a;};
const b64Bytes=b=>{const s=atob(b);const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;};
function distM(a,b){const R=6371000,d=Math.PI/180;const dla=(b.lat-a.lat)*d,dlo=(b.lon-a.lon)*d;const x=Math.sin(dla/2)**2+Math.cos(a.lat*d)*Math.cos(b.lat*d)*Math.sin(dlo/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function bearing(a,b){const d=Math.PI/180;const y=Math.sin((b.lon-a.lon)*d)*Math.cos(b.lat*d);const x=Math.cos(a.lat*d)*Math.sin(b.lat*d)-Math.sin(a.lat*d)*Math.cos(b.lat*d)*Math.cos((b.lon-a.lon)*d);return((Math.atan2(y,x)*180/Math.PI)+360)%360;}
const fmtT=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
function durTxt(min){const tr=S.lang==='tr';min=Math.round(min);return min>=60?Math.floor(min/60)+(tr?'s ':'h ')+(min%60)+(tr?'d':'m'):min+(tr?' dk':' min');}
function agoTxt(t){const s=Math.max(1,Math.round((Date.now()-t)/1000)),tr=S.lang==='tr';if(s<60)return s+(tr?' sn':'s');const m=Math.round(s/60);if(m<60)return m+(tr?' dk':'m');const h=Math.round(m/60);if(h<24)return h+(tr?' sa':'h');return Math.round(h/24)+(tr?' gün':'d');}
function compass(d){const tr=S.lang==='tr';const n=tr?['K','KD','D','GD','G','GB','B','KB']:['N','NE','E','SE','S','SW','W','NW'];return n[Math.round((((d%360)+360)%360)/45)%8];}
let toastT;function toast(m){const el=$('toast');el.textContent=m;el.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>el.style.display='none',2600);}
function rangeMs(){return {'15dk':900000,'1sa':3600000,'1g':86400000}[S.rangeKey]||3600000;}
function rangePts(v){if(!v)return [];const c=Date.now()-rangeMs();return v.track.filter(p=>p.t>=c);}
function histPt(v){const pts=rangePts(v);if(!pts.length)return v.cur;const ws=Date.now()-rangeMs(),tt=ws+S.scrub*rangeMs();let best=pts[0],bd=1e15;for(const p of pts){const dd=Math.abs(p.t-tt);if(dd<bd){bd=dd;best=p;}}return best;}
const colHex=v=>{const d=S.theme==='dark';return !v.online?'#5c6b7a':v.warn?(d?'#e8a13c':'#b97a14'):v.mov?(d?'#4c8dff':'#2467d6'):(d?'#2fce7c':'#1a9e58');};
const stc=v=>!v.online?'var(--off)':v.warn?'var(--warn)':v.mov?'var(--acc)':'var(--ok)';

/* ================= crypto / MQTT ================= */
async function importKey(id,hex){KEYS[id]=await crypto.subtle.importKey('raw',hexBytes(hex),{name:'AES-GCM'},false,['encrypt','decrypt']);}
async function decryptFor(id,b64){const blob=b64Bytes(b64);const iv=blob.slice(0,12),data=blob.slice(12);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},KEYS[id],data);return new TextDecoder().decode(pt);}
async function encryptFor(id,obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},KEYS[id],new TextEncoder().encode(JSON.stringify(obj))));const blob=new Uint8Array(iv.length+ct.length);blob.set(iv);blob.set(ct,iv.length);let s='';for(const b of blob)s+=String.fromCharCode(b);return btoa(s);}
/* Monotonic command sequence (survives reloads via wall-clock seed) so the
   device can reject replayed commands. */
let cmdSeq=Date.now();
function nextCmdSeq(){cmdSeq=Math.max(Date.now(),cmdSeq+1);return cmdSeq;}
function setMqtt(st){S.mqtt=st;const b=$('mqttBadge');if(!b)return;const on=st==='on';b.style.color=on?'var(--ok)':st==='conn'?'var(--warn)':'var(--err)';b.style.borderColor=b.style.color;b.querySelector('span').style.background=b.style.color;b.querySelector('b').textContent=on?'MQTT':st==='conn'?'MQTT…':'MQTT ✕';}
function connectMqtt(){
  setMqtt('conn');
  client=mqtt.connect(BROKER,{clientId:'zenith-'+Math.random().toString(16).slice(2,8),reconnectPeriod:3000});
  client.on('connect',()=>{setMqtt('on');DEVICES.forEach(d=>{client.subscribe(d.topic);});});
  client.on('reconnect',()=>setMqtt('conn'));
  client.on('close',()=>{if(S.mqtt!=='off')setMqtt('conn');});
  client.on('error',e=>{});
  client.on('message',async(topic,payload)=>{
    const d=DEVICES.find(x=>x.topic===topic);if(!d)return;const v=V(d.id);v.lastRaw=payload.toString();
    if(!KEYS[d.id])return;                       // locked → cannot decrypt
    try{
      const j=JSON.parse(await decryptFor(d.id,v.lastRaw));
      if(j.seq!=null){ if(v.lastSeq!=null && j.seq<=v.lastSeq) return; v.lastSeq=j.seq; }  // drop replays / out-of-order
      onTelemetry(v,j);
    }catch(e){}
  });
}
async function publishCmd(devId,obj){
  const d=DEV(devId);if(!client||!d)return;
  if(!KEYS[devId]){toast(S.lang==='tr'?'Anahtar yok — komut gönderilemez':'No key — cannot send command');return;}
  client.publish(d.cmd, await encryptFor(devId,{...obj,seq:nextCmdSeq()}));
}

/* ================= telemetry ingest ================= */
function onTelemetry(v,j){
  const now=Date.now(),lat=+j.lat,lon=+j.lon;
  let hdg=v.cur?v.cur.hdg:0;
  if(v.cur){const d=distM(v.cur,{lat,lon});if(d>=1.5)hdg=bearing(v.cur,{lat,lon});}
  v.cur={lat,lon,spd:+j.spd||0,hdop:+j.hdop||0,sat:+j.sat||0,alt:+j.alt||0,hdg,t:now};
  v.track.push({...v.cur});if(v.track.length>20000)v.track.shift();
  v.online=true;v.mov=(+j.mov===1);v.warn=(v.cur.hdop>2.5);
  computeStops(v);
  tick();
}
function computeStops(v){
  const R=25,T=4*60*1000,pts=v.track,out=[];let i=0;
  while(i<pts.length){let j=i+1;while(j<pts.length&&distM(pts[i],pts[j])<=R)j++;const dur=pts[j-1].t-pts[i].t;
    if(dur>=T){let la=0,lo=0;for(let k=i;k<j;k++){la+=pts[k].lat;lo+=pts[k].lon;}out.push({lat:la/(j-i),lon:lo/(j-i),t:pts[i].t,dur});}
    i=(j>i)?j:i+1;}
  v.stops=out;
}
function checkOffline(){let ch=false;for(const v of fleet){if(v.cur){const off=Date.now()-v.cur.t>OFFLINE_MS;if(off&&v.online){v.online=false;v.mov=false;ch=true;}}}if(ch)tick();else updateDynamic();}

/* ================= map ================= */
function tileUrl(){if(S.layer==='sat')return 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';if(S.layer==='terrain')return 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png';return S.theme==='dark'?'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png':'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';}
function applyTiles(){if(!map)return;if(tileL)map.removeLayer(tileL);tileL=L.tileLayer(tileUrl(),{maxZoom:19,subdomains:'abcd'}).addTo(map);}
function icon(v,dim){const c=colHex(v),pulse=v.mov&&S.mode==='live';const hdg=(v.cur&&v.cur.hdg)||0;
  const cone=v.mov?`<svg width="38" height="38" viewBox="0 0 38 38" style="position:absolute;inset:0;transform:rotate(${hdg}deg)"><path d="M19 19 L11 4 A17 17 0 0 1 27 4 Z" fill="${c}" opacity=".33"/></svg>`:'';
  return L.divIcon({className:'',iconSize:[38,38],iconAnchor:[19,19],html:`<div style="position:relative;width:38px;height:38px;opacity:${dim?.25:1}">${cone}<div class="${pulse?'zmk-pulse':''}" style="--pc:${c};position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:13px;height:13px;border-radius:50%;background:${c};border:2px solid #fff;box-shadow:0 0 0 2px ${c}"></div></div>`});}
/* Neutral starting view; the map re-centres on the first real fix. */
function initMap(){map=L.map('map',{zoomControl:false,attributionControl:true}).setView(CFG.center||[41.0082,28.9784],11);map.attributionControl.setPrefix('');applyTiles();map.on('click',()=>{S.layersOpen=false;S.paletteOpen=false;render();});setTimeout(()=>map.invalidateSize(),300);syncMap();}
function syncMap(){
  if(!map)return;const sel=V(S.selId),hist=S.mode==='history';
  for(const v of fleet){if(!v.cur)continue;const dim=S.focusId&&v.id!==S.focusId;
    if(!mk[v.id]){mk[v.id]=L.marker([v.cur.lat,v.cur.lon],{icon:icon(v,dim)}).addTo(map).on('click',()=>{select(v.id);}).bindTooltip(v.name,{direction:'top',offset:[0,-14]});}
    else{mk[v.id].setLatLng([v.cur.lat,v.cur.lon]).setIcon(icon(v,dim));}}
  [trail,acc,ghost,...stopMks].forEach(x=>x&&map.removeLayer(x));stopMks=[];trail=acc=ghost=null;
  if(sel&&sel.cur){const accent=colHex({online:true,warn:false,mov:true});const full=S.focusId===sel.id||hist;
    // live trail is time-windowed (same range picker) so its start stays anchored,
    // instead of a fixed 40-point window that visibly slides forward at 1 Hz.
    let src=rangePts(sel); if(src.length>3000)src=src.slice(-3000);
    const pts=src.map(p=>[p.lat,p.lon]);
    if(pts.length>1)trail=L.polyline(pts,{color:accent,weight:full?3:2.5,opacity:full?.9:.6,dashArray:full?null:'6 6'}).addTo(map);
    if(S.mode==='live')acc=L.circle([sel.cur.lat,sel.cur.lon],{radius:sel.cur.hdop*5,color:accent,weight:1,dashArray:'4 4',fillColor:accent,fillOpacity:.07}).addTo(map);
    if(full)for(const w of sel.stops){const m=L.circleMarker([w.lat,w.lon],{radius:7,color:'#fff',weight:2,fillColor:'#e25555',fillOpacity:1}).addTo(map);m.bindTooltip(fmtT(w.t)+' · '+durTxt(w.dur/60000),{direction:'top'});stopMks.push(m);}
    if(hist){const p=histPt(sel);if(p){ghost=L.marker([p.lat,p.lon],{icon:L.divIcon({className:'',iconSize:[18,18],iconAnchor:[9,9],html:'<div style="width:13px;height:13px;border-radius:50%;background:#8a97a5;border:2px solid #fff;box-shadow:0 0 0 2px #8a97a5"></div>'})}).addTo(map);if(S.playing||dragging)map.panTo([p.lat,p.lon],{animate:false});}}
    if(S.mode==='live'&&S.follow)map.panTo([sel.cur.lat,sel.cur.lon]);}
}
function fitAll(){const ll=fleet.filter(v=>v.cur).map(v=>[v.cur.lat,v.cur.lon]);if(ll.length)map.fitBounds(L.latLngBounds(ll).pad(.2));}
function select(id){S.selId=id;const v=V(id);if(v&&v.cur&&map&&S.mode==='live')map.panTo([v.cur.lat,v.cur.lon]);render();}

/* ================= console ================= */
function pushLog(dir,txt,err){const c=dir==='tx'?'var(--acc)':err?'var(--err)':'var(--tx2)';S.logs.push({c,t:(dir==='tx'?'> ':'< ')+txt});
  if(S.logs.length>400)S.logs.splice(0,S.logs.length-400);
  const el=$('conLog');if(el){const d=document.createElement('div');d.style.cssText='color:'+c+';white-space:pre-wrap;word-break:break-all';d.textContent=(dir==='tx'?'> ':'< ')+txt;el.appendChild(d);while(el.childElementCount>400)el.removeChild(el.firstChild);el.scrollTop=el.scrollHeight;}}
async function runCmd(cmd){
  pushLog('tx',cmd);
  if(S.consoleTab==='usb'){ if(!writer){await serialConnect();} await serialSend(cmd); }
  else { // MQTT downlink
    let obj=null;const m=cmd.match(/INTERVAL\s*=\s*(\d+)/i);
    if(m)obj={interval:+m[1]};else if(/REQ POS|CGNSSINFO/i.test(cmd))obj={cmd:'report'};else if(/REBOOT/i.test(cmd))obj={cmd:'reboot'};else if(/PING/i.test(cmd))obj={cmd:'ping'};
    else{try{obj=JSON.parse(cmd);}catch(e){obj={raw:cmd};}}
    publishCmd(S.selId,obj);pushLog('rx','downlink → '+JSON.stringify(obj));
  }
}
/* Web Serial (USB) */
let port,reader,writer,keepR=false,lineBuf='';
async function serialConnect(){if(!('serial'in navigator)){pushLog('rx','Web Serial yok — Chrome/Edge/Brave gerekir',true);return;}
  try{port=await navigator.serial.requestPort();await port.open({baudRate:115200});}catch(e){pushLog('rx','USB: '+e.message,true);return;}
  writer=port.writable.getWriter();keepR=true;pushLog('rx','[USB COM bağlandı @115200]');serialRead();}
async function serialRead(){const dec=new TextDecoder();reader=port.readable.getReader();try{while(keepR){const{value,done}=await reader.read();if(done)break;if(value){lineBuf+=dec.decode(value,{stream:true});let i;while((i=lineBuf.indexOf('\n'))>=0){const ln=lineBuf.slice(0,i).replace(/\r/g,'');lineBuf=lineBuf.slice(i+1);if(ln.length)pushLog('rx',ln,/ERROR/.test(ln));}}}}catch(e){}finally{try{reader.releaseLock();}catch(e){}}}
async function serialSend(cmd){if(!writer){pushLog('rx','[önce USB sekmesinde bağlan]',true);return;}await writer.write(new TextEncoder().encode(cmd+'\r\n'));}

/* ================= vault ================= */
async function unlockKey(){const el=$('keyInput');const val=(S.keyIn||'').trim();
  if(!/^[0-9a-fA-F]{64}$/.test(val)){S.keyErr=true;render();return;}
  const id=S.vaultPick;try{await importKey(id,val);
    const v=V(id);if(v&&v.lastRaw){await decryptFor(id,v.lastRaw);}  // verify by decrypting last msg (throws if wrong)
    S.vaultPick=null;S.keyErr=false;S.keyIn='';toast(dict().unlock+' ✓');render();
  }catch(e){delete KEYS[id];S.keyErr=true;render();}
}

function seg(on){return on?'background:var(--acc);color:#fff':'background:transparent;color:var(--tx2)';}
/* ---- partial builders: these are the only parts refreshed on a telemetry tick,

function ctx(){
  const T=dict(),tr=S.lang==='tr',sel=V(S.selId),hist=S.mode==='history';

}

  h+=`<div data-act="toggleFollow" class="glass" style="position:fixed;right:${S.mobile?12:300}px;bottom:${S.mobile?150:80}px;z-index:900;display:flex;align-items:center;gap:6px;background:${S.follow?'var(--acc)':'var(--glass)'};color:${S.follow?'#fff':'var(--tx)'};border-color:${S.follow?'var(--acc)':'var(--line2)'};border-radius:20px;padding:6px 14px;font-size:12px;cursor:pointer;white-space:nowrap">◎ ${T.follow}</div>`;
  if(S.focusId&&!hist&&sel)h+=`<div class="glass" style="position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:901;display:flex;align-items:center;gap:10px;border-color:var(--acc);border-radius:24px;padding:5px 8px 5px 16px;white-space:nowrap"><span style="font-size:11px;letter-spacing:.1em;color:var(--acc);font-weight:600">${T.focusMode}: ${esc(sel.name)}</span><div data-act="exitFocus" class="hb" style="font-size:11px;border:1px solid var(--line2);border-radius:14px;padding:2px 10px;cursor:pointer">✕ ${T.exitFocus}</div></div>`;
  if(hist)h+=`<div class="glass" style="position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:901;display:flex;align-items:center;gap:10px;border-color:var(--warn);border-radius:24px;padding:5px 8px 5px 16px;white-space:nowrap"><span style="font-size:11px;letter-spacing:.1em;color:var(--warn);font-weight:600">${T.hist} · <span class="mono">${p?fmtT(p.t):'—'}</span></span><div data-act="goLive" class="hb" style="font-size:11px;border:1px solid var(--line2);border-radius:14px;padding:2px 10px;cursor:pointer">◎ ${T.backLive}</div></div>`;
  if(S.focusId&&!hist&&sel)h+=`<div class="glass" style="position:fixed;left:12px;bottom:${S.mobile?150:80}px;z-index:900;display:flex;gap:16px;border-radius:10px;padding:8px 16px;font-size:12px;color:var(--tx2);white-space:nowrap"><span><b class="mono" style="color:var(--tx);font-size:14px">${(mi?km*.621:km).toFixed(1)}</b> ${T.kmToday}</span><span><b class="mono" style="color:var(--tx);font-size:14px">${durTxt(driveMin)}</b> ${T.drive}</span><span><b class="mono" style="color:var(--err);font-size:14px">${sel.stops.length}</b> ${T.stopsL}</span></div>`;

  /* right telemetry rail */
  if(!S.mobile)h+=`<div id="railWrap" style="position:fixed;top:48px;right:0;bottom:79px;width:288px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;padding:12px;gap:9px;overflow-y:auto;z-index:800">${buildRail()}</div>`;

  /* bottom dock */
  h+=`<div style="position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:9px 14px 10px;display:flex;flex-direction:column;gap:8px;z-index:1100">
    <div style="display:flex;align-items:center;gap:10px">
      <div class="seg">${rangeOpts}</div>
      <div data-act="togglePlay" class="hb" style="width:28px;height:26px;display:grid;place-items:center;border:1px solid var(--line2);border-radius:7px;cursor:pointer;flex:none;font-size:11px">${S.playing?'❚❚':'▶'}</div>
      <div data-act="cycleSpeed" class="hb mono" style="font-size:11px;color:var(--tx2);cursor:pointer;flex:none;min-width:22px">${S.speed}×</div>
      <div id="scrub" style="flex:1;height:22px;position:relative;cursor:pointer;touch-action:none">
        <div style="position:absolute;left:0;right:0;top:9px;height:4px;background:var(--panel2);border:1px solid var(--line2);border-radius:3px"></div>
        <div style="position:absolute;left:0;top:9px;height:4px;width:${(S.scrub*100).toFixed(2)}%;background:linear-gradient(90deg,transparent,var(--acc));border-radius:3px;opacity:.7"></div>
        ${stopTicks}
        <div style="position:absolute;left:${(S.scrub*100).toFixed(2)}%;top:3px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:${hist?'var(--warn)':'var(--acc)'};border:2.5px solid var(--panel);box-shadow:0 0 0 1.5px ${hist?'var(--warn)':'var(--acc)'},0 2px 6px rgba(0,0,0,.4)"></div>
      </div>
      <div data-act="goLive" style="flex:none;display:flex;align-items:center;gap:5px;font-size:10.5px;letter-spacing:.1em;font-weight:600;border:1px solid ${hist?'var(--line2)':'var(--ok)'};color:${hist?'var(--tx2)':'var(--ok)'};border-radius:14px;padding:2px 11px;cursor:pointer;white-space:nowrap"><span style="width:6px;height:6px;border-radius:50%;background:${hist?'var(--tx2)':'var(--ok)'};animation:${hist?'none':'zblink 2s infinite'}"></span>${T.live}</div></div>
    <div style="display:flex;align-items:center;gap:7px;overflow-x:auto;padding-bottom:6px;margin-bottom:-6px"><div id="chipsWrap" style="display:flex;align-items:center;gap:7px">${buildChips()}</div><div data-act="addDevice" class="hb" style="flex:none;border:1px dashed var(--line2);color:var(--tx2);border-radius:16px;padding:3px 12px;font-size:11.5px;cursor:pointer;white-space:nowrap">+ ${T.addDev}</div><div style="flex:1"></div><div data-act="fitAll" class="hb" style="flex:none;border:1px solid var(--line2);border-radius:7px;padding:3px 11px;font-size:11px;cursor:pointer;white-space:nowrap">⊞ ${T.fit}</div></div></div>`;

  /* mobile telemetry strip */
  if(S.mobile){h+=`<div style="position:fixed;left:0;right:0;bottom:79px;display:flex;gap:8px;padding:8px 10px;overflow-x:auto;background:var(--panel);border-top:1px solid var(--line);z-index:1050">
    <div class="card" style="flex:none;text-align:center;padding:5px 12px"><div class="mono" style="font-size:18px;color:${p&&p.spd>3?'var(--acc)':'var(--tx)'}">${spd}</div><div style="font-size:9px;color:var(--tx2);text-transform:uppercase">${mi?'mph':'km/s'}</div></div>
    <div class="card" style="flex:none;text-align:center;padding:5px 12px"><div class="mono" style="font-size:18px">±${p?Math.round(p.hdop*5):'—'}m</div><div style="font-size:9px;color:var(--tx2)">HDOP ${p?p.hdop.toFixed(1):'—'}</div></div>
    <div class="card" style="flex:none;text-align:center;padding:5px 12px"><div class="mono" style="font-size:18px">${p?p.sat:'—'}</div><div style="font-size:9px;color:var(--tx2);text-transform:uppercase">${T.sats}</div></div>
    <div class="card" style="flex:none;text-align:center;padding:5px 12px"><div class="mono" style="font-size:18px">${p?compass(p.hdg||0):'—'}</div><div style="font-size:9px;color:var(--tx2)">${p?Math.round(((p.hdg||0)%360+360)%360):'—'}°</div></div>
    <div data-act="openConsole" class="mono" style="flex:none;display:grid;place-items:center;border:1px solid var(--line2);border-radius:9px;padding:5px 12px;font-size:13px;cursor:pointer">&gt;_</div></div>`;}

  /* console */
  if(S.consoleOpen){const usb=S.consoleTab==='usb';
    const quick=(usb?[[tr?'GNSS Aç':'GNSS On','AT+CGNSSPWR=1'],[tr?'Konum':'Position','AT+CGNSSINFO'],[tr?'Sinyal':'Signal','AT+CSQ'],[tr?'Şebeke':'Network','AT+COPS?'],['SIM','AT+CPIN?'],[tr?'GNSS Kapat':'GNSS Off','AT+CGNSSPWR=0']]:[[tr?'Aralık 5 sn':'Interval 5s','SET INTERVAL=5'],[tr?'Konum iste':'Request pos','REQ POS'],['Ping','PING'],[tr?'Yeniden başlat':'Reboot','REBOOT']]).map(([l,c])=>`<div data-act="runCmd" data-arg="${c}" class="hb" title="${c}" style="border:1px solid var(--line2);border-radius:6px;padding:3px 11px;font-size:11px;cursor:pointer;white-space:nowrap">${l}</div>`).join('');
    const logs=S.logs.map(l=>`<div style="color:${l.c};white-space:pre-wrap;word-break:break-all">${esc(l.t)}</div>`).join('');
    h+=`<div style="position:fixed;left:0;right:0;bottom:0;height:46%;min-height:280px;background:var(--panel);border-top:1px solid var(--line2);box-shadow:0 -12px 32px rgba(0,0,0,.35);z-index:1400;display:flex;flex-direction:column;animation:zfade .18s ease">
      <div style="display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap"><span class="mono" style="font-weight:600;font-size:13px">&gt;_ ${T.console} · ${esc(sel?sel.name:'')}</span>
        <div class="seg"><div data-act="conUsb" style="${seg(usb)}">USB · COM3</div><div data-act="conMqtt" style="border-left:1px solid var(--line2);${seg(!usb)}">MQTT · ${sel?sel.id:''}</div></div>
        ${usb?`<div data-act="usbConnect" class="hb" style="font-size:11px;border:1px solid var(--acc);color:var(--acc);border-radius:6px;padding:2px 10px;cursor:pointer">USB bağlan</div>`:`<span style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ok)"><i style="width:6px;height:6px;border-radius:50%;background:var(--ok)"></i>${T.connected}</span>`}
        <div style="flex:1"></div><div data-act="clearLog" class="hb" style="font-size:11px;border:1px solid var(--line2);border-radius:6px;padding:2px 10px;cursor:pointer">${T.clear}</div><div data-act="closeConsole" class="hb" style="font-size:13px;cursor:pointer;color:var(--tx2);padding:0 4px">✕</div></div>
      <div style="display:flex;gap:6px;padding:8px 14px 0;flex-wrap:wrap">${quick}</div>
      <div id="conLog" style="flex:1;overflow-y:auto;margin:8px 14px;background:var(--in);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;line-height:1.75">${logs}</div>
      <div style="display:flex;gap:8px;padding:0 14px 12px"><input id="cmdInput" placeholder="${T.freeCmd}" value="${esc(S.cmdIn)}" style="flex:1;height:30px;padding:0 12px;font-family:'IBM Plex Mono',monospace;font-size:12px;border-radius:7px"><div data-act="sendCmd" style="background:var(--acc);color:#fff;border-radius:7px;padding:0 18px;display:grid;place-items:center;font-size:12px;cursor:pointer;white-space:nowrap">${T.send} ↵</div></div></div>`;}

  /* vault */
  if(S.vaultOpen){const rows=fleet.map(v=>{const open=!!KEYS[v.id],picked=S.vaultPick===v.id;return `<div style="display:flex;align-items:center;gap:9px;padding:7px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:9px"><span style="width:8px;height:8px;border-radius:50%;background:${open?'var(--ok)':'var(--err)'}"></span><span style="font-size:12.5px">${esc(v.name)}</span><div style="flex:1"></div>${open?`<span style="font-size:10.5px;border:1px solid var(--ok);color:var(--ok);border-radius:12px;padding:2px 10px">${T.unlocked}</span>`:`<div data-act="vaultPick" data-arg="${v.id}" style="font-size:10.5px;border:1px solid ${picked?'var(--acc)':'var(--line2)'};color:${picked?'var(--acc)':'var(--tx2)'};border-radius:12px;padding:2px 10px;cursor:pointer">${T.enterKey}</div>`}</div>`;}).join('');
    const pick=S.vaultPick?`<div style="display:flex;flex-direction:column;gap:8px;border:1px solid var(--acc);border-radius:10px;padding:10px"><div style="font-size:11px;color:var(--acc)">${esc(V(S.vaultPick).name)} — ${T.keyFor}</div><input id="keyInput" placeholder="${T.keyIn}" value="${esc(S.keyIn)}" style="height:30px;padding:0 10px;font-family:'IBM Plex Mono',monospace;font-size:12px;border-radius:7px;letter-spacing:.05em"><div style="display:flex;gap:8px;align-items:center"><div class="seg"><div data-act="kmSession" style="${seg(S.keyMode==='session')}">${T.session}</div><div data-act="kmManual" style="border-left:1px solid var(--line2);${seg(S.keyMode==='manual')}">${T.manual}</div></div><div style="flex:1"></div><div data-act="unlock" style="background:var(--acc);color:#fff;border-radius:7px;padding:4px 16px;font-size:12px;cursor:pointer">${T.unlock}</div></div>${S.keyErr?`<div style="font-size:11px;color:var(--err)">${T.keyErrTxt}</div>`:''}</div>`:'';
    h+=`<div data-act="closeVault" style="position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(3px);z-index:1500;display:grid;place-items:center"><div data-act="stop" style="width:min(420px,92vw);max-height:80vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px;animation:zfade .2s ease"><div style="display:flex;align-items:center;gap:8px"><span style="font-weight:700;font-size:15px">🗝 ${T.vault}</span><span class="mono" style="font-size:10.5px;color:var(--tx2)">AES-256-GCM</span><div style="flex:1"></div><div data-act="closeVault" style="cursor:pointer;color:var(--tx2)">✕</div></div>${rows}${pick}<div style="font-size:10.5px;color:var(--tx2);border-top:1px dashed var(--line2);padding-top:8px;line-height:1.5">${T.vaultNote}</div></div></div>`;}

  /* settings */
  if(S.settingsOpen){h+=`<div data-act="closeSettings" style="position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:1500"></div>
    <div style="position:fixed;top:0;right:0;bottom:0;width:min(320px,88vw);background:var(--panel);border-left:1px solid var(--line2);box-shadow:var(--shadow);z-index:1501;padding:16px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;animation:zfade .18s ease">
    <div style="display:flex;align-items:center;margin-bottom:8px"><span style="font-weight:700;font-size:15px">⚙ ${T.settings}</span><div style="flex:1"></div><div data-act="closeSettings" style="cursor:pointer;color:var(--tx2)">✕</div></div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)"><span style="font-size:12.5px">${T.theme}</span><div class="seg"><div data-act="setDark" style="${seg(S.theme==='dark')}">${T.dark}</div><div data-act="setLight" style="border-left:1px solid var(--line2);${seg(S.theme==='light')}">${T.light}</div></div></div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)"><span style="font-size:12.5px">${T.langL}</span><div class="seg"><div data-act="setTr" style="${seg(tr)}">TR</div><div data-act="setEn" style="border-left:1px solid var(--line2);${seg(!tr)}">EN</div></div></div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)"><span style="font-size:12.5px">${T.unit}</span><div class="seg"><div data-act="setKm" style="${seg(!mi)}">km</div><div data-act="setMi" style="border-left:1px solid var(--line2);${seg(mi)}">mi</div></div></div>
    <div style="padding:9px 0;border-bottom:1px dashed var(--line)"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:12.5px">${T.repInt}</span><span class="mono" style="font-size:12px;color:var(--acc)">${S.interval} sn</span></div>
      <input id="intRange" type="range" min="1" max="20" value="${S.interval}" style="width:100%;margin-top:8px;accent-color:var(--acc);background:transparent"><div style="font-size:10px;color:var(--tx2);display:flex;justify-content:space-between"><span>1 sn</span><span style="border:1px solid var(--acc);color:var(--acc);border-radius:10px;padding:0 8px;font-size:9.5px">downlink</span><span>20 sn</span></div></div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)"><span style="font-size:12.5px">${T.notifMove}</span><div data-act="togNotifMove" style="width:34px;height:18px;border-radius:10px;background:${S.notifMove?'var(--ok)':'var(--line2)'};position:relative;cursor:pointer"><div style="position:absolute;top:2px;left:${S.notifMove?'18px':'2px'};width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s"></div></div></div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)"><span style="font-size:12.5px">${T.notifOff}</span><div data-act="togNotifOff" style="width:34px;height:18px;border-radius:10px;background:${S.notifOff?'var(--ok)':'var(--line2)'};position:relative;cursor:pointer"><div style="position:absolute;top:2px;left:${S.notifOff?'18px':'2px'};width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s"></div></div></div>
    <div style="flex:1"></div><div class="mono" style="font-size:10px;color:var(--tx3);text-align:center">ZENITH · ESP32-S3 + A7608 · MQTT/WSS</div></div>`;}

  return h;
}

/* ================= render + bindings ================= */
const ui=$('ui');
function render(){
  const a=document.activeElement,aid=a&&a.id,ss=a&&a.selectionStart,se=a&&a.selectionEnd;
  ui.innerHTML=buildUI();
  setMqtt(S.mqtt);
  if(aid){const n=$(aid);if(n){try{n.focus();if(ss!=null)n.setSelectionRange(ss,se);}catch(e){}}}
  postRender();
}
function postRender(){
  const si=$('searchInput');if(si)si.oninput=e=>{S.search=e.target.value;render();};
  const ci=$('cmdInput');if(ci){ci.oninput=e=>S.cmdIn=e.target.value;ci.onkeydown=e=>{if(e.key==='Enter'){A.sendCmd();}};}
  const ki=$('keyInput');if(ki)ki.oninput=e=>S.keyIn=e.target.value;
  const ir=$('intRange');if(ir)ir.onchange=e=>{S.interval=+e.target.value;publishCmd(S.selId,{interval:S.interval});toast((S.lang==='tr'?'Downlink: aralık → ':'Downlink: interval → ')+S.interval+'s');render();};
  const sc=$('scrub');if(sc){const move=e=>{const r=sc.getBoundingClientRect();const pct=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));if(pct>=.995){S.scrub=1;S.mode='live';S.playing=false;}else{S.scrub=pct;S.mode='history';S.playing=false;}syncMap();render();};
    sc.onpointerdown=e=>{sc.setPointerCapture(e.pointerId);dragging=true;move(e);};sc.onpointermove=e=>{if(dragging)move(e);};sc.onpointerup=()=>{dragging=false;};}
}
/* delegated clicks: actions receive (e, el) */
ui.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const fn=A[el.dataset.act];if(fn)fn(e,el);});

/* lightweight tick (no full rebuild when idle typing) */
/* Telemetry path: refresh ONLY the live regions. The console / vault / settings and
   every input keep their DOM (and focus), so nothing flickers at 1 Hz. */
function liveUpdate(){
  const r=$('railWrap'); if(r) r.innerHTML=buildRail();
  const c=$('chipsWrap'); if(c) c.innerHTML=buildChips();
  const k=$('kpiWrap'); if(k) k.innerHTML=buildKpi();
  const lc=$('liveCount'); if(lc){const sel=V(S.selId); lc.textContent=(sel?rangePts(sel).length:0)+' nokta';}
  setMqtt(S.mqtt);
}
function updateDynamic(){liveUpdate();}
function tick(){syncMap();liveUpdate();}

/* playback timer */
setInterval(()=>{if(S.playing&&S.mode==='history'){S.scrub+=S.speed*.02;if(S.scrub>=1){S.scrub=1;S.playing=false;S.mode='live';}syncMap();render();}},400);
setInterval(checkOffline,5000);

/* ================= boot ================= */
(async function(){
  document.body.dataset.th=S.theme;
  S.mobile=window.matchMedia('(max-width:760px)').matches;
  window.matchMedia('(max-width:760px)').addEventListener('change',e=>{S.mobile=e.matches;render();});
  for(const d of DEVICES){if(d.keyHex)try{await importKey(d.id,d.keyHex);}catch(e){}}  // preload demo key
  render();
  const wait=setInterval(()=>{if(window.L){clearInterval(wait);initMap();render();}},80);
  connectMqtt();
})();
window.A=A;
</script>
</body></html>
